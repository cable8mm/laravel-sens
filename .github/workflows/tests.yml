name: tests

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - laravel: 10.*
                      testbench: ^8.0
                      php: 8.2
                    - laravel: 10.*
                      testbench: ^8.0
                      php: 8.3
                    - laravel: 11.*
                      testbench: ^9.0
                      php: 8.2
                    - laravel: 11.*
                      testbench: ^9.0
                      php: 8.3
                    - laravel: 11.*
                      testbench: ^9.0
                      php: 8.4
                    - laravel: 12.*
                      testbench: ^10.0
                      php: 8.2
                    - laravel: 12.*
                      testbench: ^10.0
                      php: 8.3
                    - laravel: 12.*
                      testbench: ^10.0
                      php: 8.4
                    - laravel: 13.*
                      testbench: ^11.0
                      php: 8.3
                    - laravel: 13.*
                      testbench: ^11.0
                      php: 8.4

        name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Install dependencies
              run: |
                  composer config policy.advisories.block false
                  composer require \
                      "illuminate/support:${{ matrix.laravel }}" \
                      "illuminate/notifications:${{ matrix.laravel }}" \
                      "orchestra/testbench:${{ matrix.testbench }}" \
                      --no-interaction \
                      --no-update
                  composer update --prefer-dist --no-progress --no-interaction

            - name: Execute tests
              run: composer test
